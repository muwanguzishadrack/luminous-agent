name: luminous-dev

# App-side background processes run in this stack too (D-019), so they start
# with `docker compose up -d` like the infra does. They bind-mount the project
# and therefore need service-network hostnames instead of the host's mapped
# ports. Real environment variables beat .env values in Laravel (the dotenv
# repository is immutable), so these overrides win inside the containers.
x-worker: &worker
  build:
    context: ..
    dockerfile: docker/worker/Dockerfile
  restart: unless-stopped
  working_dir: /app
  volumes:
    - ..:/app
  environment:
    DB_HOST: postgres
    DB_PORT: 5432
    REDIS_HOST: redis
    REDIS_PORT: 6379
    MEILISEARCH_HOST: http://meilisearch:7700
    AWS_ENDPOINT: http://minio:9000
    MAIL_HOST: mailpit
    MAIL_PORT: 1025
    # Server-side broadcasting target; the browser still uses the mapped port
    # from VITE_REVERB_* in .env.
    REVERB_HOST: reverb
    REVERB_PORT: 8080
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: luminous
      POSTGRES_USER: luminous
      POSTGRES_PASSWORD: secret
    ports: ["55432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U luminous -d luminous"]
      interval: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports: ["56379:6379"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  meilisearch:
    image: getmeili/meilisearch:latest
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: masterKeyChangeMe
      MEILI_ENV: development
    ports: ["57700:7700"]
    volumes: [meilidata:/meili_data]

  minio:
    image: minio/minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: luminous
      MINIO_ROOT_PASSWORD: secretsecret
    ports: ["59000:9000", "59001:9001"]
    volumes: [miniodata:/data]

  minio-init:
    image: minio/mc
    depends_on: [minio]
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 luminous secretsecret &&
      mc mb --ignore-existing local/luminous-media
      "

  mailpit:
    image: axllent/mailpit
    restart: unless-stopped
    ports: ["58025:8025", "51025:1025"]

  horizon:
    <<: *worker
    command: ["php", "artisan", "horizon"]
    # Give in-flight jobs room to finish before the container is killed —
    # a half-processed webhook delivery is the thing we never want.
    stop_grace_period: 30s

  scheduler:
    <<: *worker
    command: ["php", "artisan", "schedule:work"]

  reverb:
    <<: *worker
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
    ports: ["58085:8080"]

volumes:
  pgdata:
  redisdata:
  meilidata:
  miniodata:
